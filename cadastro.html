<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Safe Samas</title>
    <!-- Adicionado versionamento de CSS -->
    <link rel="stylesheet" href="css/style.css?v=1.1">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
</head>
<body>

    <main class="container">
        <!-- LOGO ATUALIZADA -->
        <img src="assets/images/escudo.png" alt="Logo Safe Samas" id="logo" style="max-width: 100px; display: block; margin: 0 auto 15px auto;">

        <h1 id="tituloPagina">🐾/🔑 Cadastrar</h1>
        <p class="subtitulo">Preencha os dados do seu pet ou item para gerar seu perfil.</p>

        <form id="formCadastro">
            
            <label for="tipo">📦 O que você deseja proteger?</label>
            <select id="tipo" class="input-samas">
                <option value="pet">🐾 Pet</option>
                <option value="item">🔑 Item / Objeto</option>
                <option value="veiculo">🚗 Veículo</option>
            </select>

            <div id="categoriaItem" style="display:none;">
                <label for="categoria">📦 Categoria do Item</label>
                <select id="categoria" class="input-samas">
                    <option value="">Selecione</option>
                    <option value="chaves">🔑 Chaves</option>
                    <option value="carteira">👛 Carteira</option>
                    <option value="mochila">🎒 Mochila</option>
                    <option value="notebook">💻 Notebook</option>
                    <option value="mala">🧳 Mala</option>
                    <option value="documento">📄 Documento</option>
                    <option value="celular">📱 Celular</option>
                    <option value="outro">📦 Outro</option>
                </select>
            </div>

            <div id="blocoNome">
                <label id="labelNome" for="nomePet">🐾 Nome do Pet</label>
                <input
                    type="text"
                    id="nomePet"
                    placeholder="Digite o nome"
                    required>
            </div>

            <label for="nomeTutor">👤 Nome do Proprietário</label>
            <input type="text" id="nomeTutor" placeholder="Digite seu nome" required>

            <label for="cidade">📍 Cidade</label>
            <input type="text" id="cidade" placeholder="Digite sua cidade" required>

            <label for="telefone">📞 WhatsApp</label>
            <input type="tel" id="telefone" placeholder="Ex.: (42) 99999-9999" required>

            <div id="dadosVeiculo" style="display:none;">
                <hr>
                <h3>🚗 Dados do Veículo</h3>
                <label for="marcaVeiculo">Marca</label>
                <input type="text" id="marcaVeiculo" placeholder="Ex.: Toyota">
                <label for="modeloVeiculo">Modelo</label>
                <input type="text" id="modeloVeiculo" placeholder="Ex.: Corolla XEI">
                <label for="corVeiculo">Cor</label>
                <input type="text" id="corVeiculo" placeholder="Ex.: Prata">
                <label for="placaVeiculo">Placa</label>
                <input type="text" id="placaVeiculo" placeholder="ABC-1234">
            </div>

            <div id="dadosEmergencia" style="display:none;">
                <hr>
                <h3>🚑 Informações do Motorista</h3>
                <label for="tipoSanguineo">Tipo sanguíneo</label>
                <select id="tipoSanguineo" class="input-samas">
                    <option value="">Selecione</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>
                <label for="condicaoMedica">Condição importante</label>
                <input type="text" id="condicaoMedica" placeholder="Ex.: Diabetes, Epilepsia ou Nenhuma">
                <hr>
                <h3>👤 Contato de Emergência</h3>
                <label>Nome</label>
                <input type="text" id="nomeEmergencia" placeholder="Nome do contato">
                <label>Telefone</label>
                <input type="tel" id="telefoneEmergencia" placeholder="WhatsApp">
                <label>Parentesco</label>
                <input type="text" id="parentescoEmergencia" placeholder="Ex.: Esposa, Pai, Filho">
            </div>

            <div id="contatoConfianca" style="display:none;">
                <hr>
                <h3>👤 Contato de confiança</h3>
                <p style="font-size:13px;color:#666;">
                    Utilizado apenas caso este item seja um celular.
                </p>

                <label>Nome</label>
                <input
                    type="text"
                    id="contatoNome"
                    placeholder="Nome do contato">

                <label>Telefone</label>
                <input
                    type="tel"
                    id="contatoTelefone"
                    placeholder="WhatsApp">

                <label>Parentesco</label>
                <input
                    type="text"
                    id="contatoParentesco"
                    placeholder="Ex.: Esposa, Pai, Filho">
            </div>

            <label for="foto">📷 Foto Principal</label>
            <input type="file" id="foto" accept="image/*">
            <div id="fotosVeiculo" style="display:none;">
                <label for="foto2">📷 Foto Traseira</label>
                <input type="file" id="foto2" accept="image/*">
                <label for="foto3">📷 Foto Lateral</label>
                <input type="file" id="foto3" accept="image/*">
            </div>
            <p style="font-size:13px;color:#666;margin-top:8px;">
                Utilize fotos recentes e bem iluminadas.
            </p>

            <div class="card-termos">
                <input type="checkbox" id="aceiteTermos" required>
                <label for="aceiteTermos">
                    Declaro estar ciente e aceito que a validade do QR Code é de <b>1 (um) ano</b> a partir da ativação. 
                    <a href="termos.html" target="_blank" style="color: #007bff; text-decoration: underline;">(Ver Termos)</a>
                </label>
            </div>

            <br>
            <button type="submit" class="btn-samas">💾 Salvar</button>
        </form>

        <br>
        <a href="meus-pets.html"><button class="btn-samas">🐾/🔑 Meus Cadastros</button></a>
        <br><br>
        <a href="index.html" style="color: #2c3e50; font-weight: bold;">← Voltar para a Página Inicial</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/assinatura.js"></script>
    <script>
        console.log("CADASTRO.HTML ATUALIZADO");

        const tipo = document.getElementById("tipo");
        const categoria = document.getElementById("categoria");
        const blocoCategoria = document.getElementById("categoriaItem");
        const blocoContato = document.getElementById("contatoConfianca");

        tipo.addEventListener("change", atualizarCampos);
        categoria.addEventListener("change", atualizarCampos);

        function atualizarCampos() {

            const blocoNome = document.getElementById("blocoNome");
            const labelNome = document.getElementById("labelNome");
            const fotosVeiculo = document.getElementById("fotosVeiculo");

            // ===========================
            // VEÍCULO
            // ===========================

            if (tipo.value === "veiculo") {

                blocoNome.style.display = "none";

                blocoCategoria.style.display = "none";

                blocoContato.style.display = "none";

                document.getElementById("dadosVeiculo").style.display = "block";

                document.getElementById("dadosEmergencia").style.display = "block";

                fotosVeiculo.style.display = "block";

                return;
            }

            // Mostra novamente o campo nome
            blocoNome.style.display = "block";

            fotosVeiculo.style.display = "none";

            // ===========================
            // ITEM
            // ===========================

            if (tipo.value === "item") {

                labelNome.innerHTML = "🔑 Nome do Item";

                blocoCategoria.style.display = "block";

            } else {

                labelNome.innerHTML = "🐾 Nome do Pet";

                blocoCategoria.style.display = "none";

                blocoContato.style.display = "none";

            }

            // ===========================
            // CELULAR
            // ===========================

            if (

                tipo.value === "item" &&

                categoria.value === "celular"

            ) {

                blocoContato.style.display = "block";

            } else {

                blocoContato.style.display = "none";

            }

            document.getElementById("dadosVeiculo").style.display = "none";

            document.getElementById("dadosEmergencia").style.display = "none";

        }

        atualizarCampos();
    </script>
    <script src="js/cadastro.js"></script>

</body>
</html>
